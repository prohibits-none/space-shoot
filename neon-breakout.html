<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON BREAKOUT</title><link rel="stylesheet" href="arcade.css"><style>body{touch-action:none}.wrap{max-width:600px;margin:auto;text-align:center}.game{display:block;width:min(66vw,396px);height:auto;margin:12px auto;border:3px solid #ff1744;border-radius:18px;background:#02030b;box-shadow:0 0 28px #ff174466}.gameBox{position:relative;width:100%}.gameOverBtn{display:none}@media(max-width:800px){.game{width:min(94vw,560px)}.gameOverBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 34px;font-size:19px;font-weight:900;border:3px solid #fff;border-radius:14px;background:#07122a;color:#fff;box-shadow:0 0 18px #ff1744,0 0 30px #fff;z-index:10}.gameOverBtn.show{display:block!important}}@media(min-width:801px){.gameOverBtn{display:none!important}}</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><div class="wrap"><h1>🧱 NEON BREAKOUT</h1><p>Break the blocks, grab powers and survive as long as you can.</p><div class="hud">SCORE <b id="score">0</b> · BEST <b id="best">0</b> · ⚡ <b id="power">NONE</b></div><div class="legend"><span>🔵 WIDE</span><span>🟣 MULTI</span><span>🟢 SLOW</span><span>🟡 SHIELD</span><span>🔴 FAST</span><span>⚫ SHRINK</span><span>🟠 CHAOS</span></div><div class="gameBox"><canvas id="game" class="game" width="560" height="620"></canvas><button id="screenRestart" class="gameOverBtn">↻ RESTART</button></div><p class="help">PC: ← → / A D / mouse • Mobile: drag/touch • Space/tap = launch</p><button id="restart">RESTART</button></div></main><script>(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,S=document.getElementById('score'),B=document.getElementById('best'),P=document.getElementById('power'),R=document.getElementById('screenRestart');let paddle,balls,bricks,drops,score,playing,raf,last,keys=new Set(),power='NONE',until=0,shield=0;const key='neonBreakoutBest';function make(){let a=[];for(let r=0;r<7;r++)for(let q=0;q<9;q++)a.push({x:30+q*56,y:62+r*28,w:48,h:20,hp:r<2?2:1,on:true});return a}function ball(stuck=true){return{x:W/2,y:H-62,vx:(Math.random()<.5?-1:1)*3.1,vy:-4.2,r:8,stuck}}function sync(){S.textContent=score;B.textContent=localStorage.getItem(key)||0;P.textContent=power}function reset(){cancelAnimationFrame(raf);paddle={x:225,y:H-42,w:110,base:110,s:8};balls=[ball()];bricks=make();drops=[];score=0;playing=true;power='NONE';until=0;shield=0;last=performance.now();R.classList.remove('show');sync();draw();raf=requestAnimationFrame(loop)}function launch(){balls.forEach(b=>b.stuck=false)}function move(px){paddle.x=Math.max(8,Math.min(W-paddle.w-8,px-paddle.w/2));balls.forEach(b=>{if(b.stuck)b.x=paddle.x+paddle.w/2})}function setPower(n,t){power=n;until=performance.now()+t;sync()}function spawn(px,py){const ts=['WIDE','MULTI','SLOW','SHIELD','FAST','SHRINK','CHAOS'];drops.push({x:px-12,y:py-12,w:24,h:24,vy:2,t:ts[Math.floor(Math.random()*ts.length)]})}function apply(t){if(t==='WIDE'){paddle.w=185;setPower(t,8000)}else if(t==='SHRINK'){paddle.w=58;setPower(t,6500)}else if(t==='SHIELD'){shield=1;setPower(t,10000)}else if(t==='SLOW'){balls.forEach(b=>{b.vx*=.62;b.vy*=.62});setPower(t,7000)}else if(t==='FAST'){balls.forEach(b=>{b.vx*=1.3;b.vy*=1.3});setPower(t,6500)}else if(t==='MULTI'){if(balls.length<3){let b=balls[0];balls.push({x:b.x,y:b.y,vx:-b.vx,vy:b.vy,r:8,stuck:false})}setPower(t,10000)}else{balls.forEach(b=>{b.vx+=(Math.random()-.5)*3;b.vy+=(Math.random()-.5)*2;b.vy=b.vy>0?Math.max(2.8,b.vy):-Math.max(2.8,Math.abs(b.vy))});setPower(t,5000)}}function expire(){if(!until||performance.now()<until)return;if(power==='WIDE'||power==='SHRINK')paddle.w=paddle.base;if(power==='SLOW')balls.forEach(b=>{b.vx*=1.61;b.vy*=1.61});if(power==='FAST')balls.forEach(b=>{b.vx*=.77;b.vy*=.77});if(power==='SHIELD')shield=0;power='NONE';until=0;sync()}function end(msg='GAME OVER'){playing=false;localStorage.setItem(key,Math.max(score,+(localStorage.getItem(key)||0)));sync();draw(msg);R.classList.add('show')}function hitBrick(b){for(const q of bricks){if(!q.on||b.x+b.r<q.x||b.x-b.r>q.x+q.w||b.y+b.r<q.y||b.y-b.r>q.y+q.h)continue;q.hp--;if(q.hp<=0){q.on=false;score+=10;if(Math.random()<.22)spawn(q.x+q.w/2,q.y+q.h/2)}else score+=5;b.vy=-b.vy;return}}function update(dt){if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A'))paddle.x-=paddle.s*dt;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D'))paddle.x+=paddle.s*dt;paddle.x=Math.max(8,Math.min(W-paddle.w-8,paddle.x));for(let i=balls.length-1;i>=0;i--){let b=balls[i];if(b.stuck){b.x=paddle.x+paddle.w/2;b.y=paddle.y-b.r-2;continue}b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h&&b.x>=paddle.x&&b.x<=paddle.x+paddle.w){let h=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);b.vx=Math.max(-6,Math.min(6,h*5.8));b.vy=-Math.max(3.5,Math.abs(b.vy));b.y=paddle.y-b.r}hitBrick(b);if(b.y>H+25){balls.splice(i,1);if(!balls.length){if(shield){shield=0;power='NONE';until=0;balls=[ball(false)]}else end()}}}for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=d.vy*dt;if(d.x<paddle.x+paddle.w&&d.x+d.w>paddle.x&&d.y+d.h>paddle.y&&d.y<paddle.y+paddle.h){apply(d.t);drops.splice(i,1)}else if(d.y>H+30)drops.splice(i,1)}if(!bricks.some(q=>q.on))end('YOU WIN!')}function draw(msg){x.fillStyle='#02030b';x.fillRect(0,0,W,H);for(let i=0;i<45;i++){x.fillStyle=i%2?'#111b3d':'#26305b';x.fillRect((i*97)%W,(i*53)%H,2,2)}x.shadowBlur=14;bricks.forEach((q,i)=>{if(!q.on)return;x.shadowColor=i%2?'#ff3cf2':'#00eaff';x.fillStyle=i%2?'#ff3cf2':'#00eaff';x.fillRect(q.x,q.y,q.w,q.h);if(q.hp>1){x.fillStyle='#fff';x.fillRect(q.x+18,q.y+7,12,3)}});const col={WIDE:'#00eaff',MULTI:'#ff3cf2',SLOW:'#00ff88',SHIELD:'#ffe600',FAST:'#ff5533',SHRINK:'#777',CHAOS:'#ff9d00'};drops.forEach(d=>{x.shadowColor=col[d.t];x.fillStyle=col[d.t];x.beginPath();x.arc(d.x+12,d.y+12,11,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#02030b';x.font='bold 11px Arial';x.textAlign='center';x.fillText(d.t[0],d.x+12,d.y+16)});x.shadowBlur=16;x.shadowColor=shield?'#ffe600':'#fff';x.fillStyle='#fff';x.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);balls.forEach(b=>{x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill()});/* RED BOUNCE LINE */x.shadowBlur=22;x.shadowColor='#ff1744';x.fillStyle='#ff1744';x.fillRect(2,H-10,W-4,7);x.shadowBlur=0;if(!playing){x.fillStyle='#fff';x.textAlign='center';x.font='bold 34px Arial';x.fillText(msg,W/2,H/2);x.font='bold 16px Arial';x.fillText('Press Enter or RESTART',W/2,H/2+32)}}function loop(t){if(!playing)return;let dt=Math.min((t-last)/16.67,1.5);last=t;expire();update(dt);if(playing){sync();draw();raf=requestAnimationFrame(loop)}}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' ')launch();if(e.key==='Enter'&&!playing)reset()});addEventListener('keyup',e=>keys.delete(e.key));c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();move((e.clientX-r.left)*W/r.width)});c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();move((e.clientX-r.left)*W/r.width);launch()});document.getElementById('restart').onclick=reset;R.onclick=reset;reset()})()</script></body></html>
