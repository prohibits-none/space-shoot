<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON BREAKOUT</title><link rel="stylesheet" href="arcade.css"><style>body{touch-action:none}.wrap{max-width:600px;margin:auto;text-align:center}.game{display:block;width:min(94vw,560px);height:auto;margin:12px auto;border:2px solid #00eaff;border-radius:18px;background:#02030b;box-shadow:0 0 28px #00eaff33}.hud{font-weight:900;margin:8px}.help,.legend{color:#9fc5e8;font-size:13px}.legend{line-height:1.7}.legend span{white-space:nowrap;margin:0 3px}</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><div class="wrap"><h1>🧱 NEON BREAKOUT</h1><p>Break the blocks, grab falling powers and survive every wave.</p><div class="hud">SCORE <b id="score">0</b> · BEST <b id="best">0</b> · LIVES <b id="lives">3</b> · ⚡ <b id="power">NONE</b></div><div class="legend"><span>🔵 WIDE</span><span>🟣 MULTI</span><span>🟢 SLOW</span><span>🟡 SHIELD</span><span>🔴 FAST</span><span>⚫ SHRINK</span><span>🟠 CHAOS</span></div><canvas id="game" class="game" width="560" height="620"></canvas><p class="help">PC: ← → / A D / mouse • Mobile: drag or touch • Space/tap = launch</p><button id="restart">RESTART</button></div></main><script>(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),powerEl=document.getElementById('power'),bestKey='neonBreakoutBest';let paddle,balls,bricks,powerups,score,lives,playing,raf,last,keys=new Set(),active={name:'NONE',until:0},shield=0;function makeBricks(){const a=[];for(let r=0;r<7;r++)for(let col=0;col<9;col++)a.push({x:30+col*56,y:62+r*28,w:48,h:20,on:true,hp:r<2?2:1});return a}function newBall(stuck=true){return{x:W/2,y:H-62,vx:(Math.random()<.5?-1:1)*3.1,vy:-4.2,r:8,stuck}}function reset(){cancelAnimationFrame(raf);paddle={x:W/2-55,y:H-42,w:110,h:14,baseW:110,s:8};balls=[newBall(true)];bricks=makeBricks();powerups=[];score=0;lives=3;playing=true;active={name:'NONE',until:0};shield=0;last=performance.now();sync();draw();raf=requestAnimationFrame(loop)}function sync(){scoreEl.textContent=score;livesEl.textContent=lives;bestEl.textContent=localStorage.getItem(bestKey)||0;powerEl.textContent=active.name}function launch(){balls.forEach(b=>{b.stuck=false})}function movePaddle(x){paddle.x=Math.max(8,Math.min(W-paddle.w-8,x-paddle.w/2));balls.forEach(b=>{if(b.stuck)b.x=paddle.x+paddle.w/2})}function setPower(name,ms){active={name,until:performance.now()+ms};sync()}function spawnPower(x,y){const types=['WIDE','MULTI','SLOW','SHIELD','FAST','SHRINK','CHAOS'];const type=types[Math.floor(Math.random()*types.length)];powerups.push({x:x-12,y:y-12,w:24,h:24,vy:2,type})}function applyPower(type){if(type==='WIDE'){paddle.w=Math.min(185,paddle.baseW*1.65);setPower('WIDE',8000)}else if(type==='SHRINK'){paddle.w=58;setPower('SHRINK',6500)}else if(type==='SHIELD'){shield=1;setPower('SHIELD',10000)}else if(type==='SLOW'){balls.forEach(b=>{b.vx*=.62;b.vy*=.62});setPower('SLOW',7000)}else if(type==='FAST'){balls.forEach(b=>{b.vx*=1.3;b.vy*=1.3});setPower('FAST',6500)}else if(type==='MULTI'){if(balls.length<3){const b=balls[0];balls.push({x:b.x,y:b.y,vx:-b.vx,vy:b.vy,r:b.r,stuck:false})}setPower('MULTI',10000)}else if(type==='CHAOS'){balls.forEach(b=>{b.vx+=(Math.random()-.5)*3;b.vy+=(Math.random()-.5)*2;b.vy=b.vy>0?Math.max(2.8,b.vy):-Math.max(2.8,Math.abs(b.vy))});setPower('CHAOS',5000)}}function expirePower(){if(active.name==='NONE'||performance.now()<active.until)return;if(active.name==='WIDE'||active.name==='SHRINK')paddle.w=paddle.baseW;if(active.name==='SLOW')balls.forEach(b=>{b.vx*=1.61;b.vy*=1.61});if(active.name==='FAST')balls.forEach(b=>{b.vx*=.77;b.vy*=.77});if(active.name==='SHIELD')shield=0;active={name:'NONE',until:0};sync()}function end(win){playing=false;const best=Math.max(score,Number(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,best);sync();draw(win?'YOU WIN!':'GAME OVER')}function loseBall(index){balls.splice(index,1);if(balls.length)return;if(shield){shield=0;active={name:'NONE',until:0};balls=[newBall(false)];sync();return}lives--;if(lives<=0)end(false);else balls=[newBall(true)]}function bouncePaddle(b){const hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);b.vx=Math.max(-6,Math.min(6,hit*5.8));b.vy=-Math.max(3.5,Math.abs(b.vy));b.y=paddle.y-b.r}function brickHit(b){for(const br of bricks){if(!br.on||b.x+b.r<br.x||b.x-b.r>br.x+br.w||b.y+b.r<br.y||b.y-b.r>br.y+br.h)continue;br.hp--;if(br.hp<=0){br.on=false;score+=10;if(Math.random()<.22)spawnPower(br.x+br.w/2,br.y+br.h/2)}else score+=5;b.vy=-b.vy;return}}function update(dt){if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A'))paddle.x-=paddle.s*dt;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D'))paddle.x+=paddle.s*dt;paddle.x=Math.max(8,Math.min(W-paddle.w-8,paddle.x));for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(b.stuck){b.x=paddle.x+paddle.w/2;b.y=paddle.y-b.r-2;continue}b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h&&b.x>=paddle.x&&b.x<=paddle.x+paddle.w)bouncePaddle(b);brickHit(b);if(b.y>H+25)loseBall(i)}for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];p.y+=p.vy*dt;if(p.x<paddle.x+paddle.w&&p.x+p.w>paddle.x&&p.y+p.h>paddle.y&&p.y<paddle.y+paddle.h){applyPower(p.type);powerups.splice(i,1)}else if(p.y>H+30)powerups.splice(i,1)}if(!bricks.some(b=>b.on))end(true)}function draw(message){ctx.fillStyle='#02030b';ctx.fillRect(0,0,W,H);for(let i=0;i<45;i++){ctx.fillStyle=i%2?'#111b3d':'#26305b';ctx.fillRect((i*97)%W,(i*53)%H,2,2)}ctx.shadowBlur=14;bricks.forEach((b,i)=>{if(!b.on)return;ctx.shadowColor=i%2?'#ff3cf2':'#00eaff';ctx.fillStyle=i%2?'#ff3cf2':'#00eaff';ctx.fillRect(b.x,b.y,b.w,b.h);if(b.hp>1){ctx.fillStyle='#fff';ctx.fillRect(b.x+18,b.y+7,12,3)}});const colors={WIDE:'#00eaff',MULTI:'#ff3cf2',SLOW:'#00ff88',SHIELD:'#ffe600',FAST:'#ff5533',SHRINK:'#777',CHAOS:'#ff9d00'};powerups.forEach(p=>{ctx.shadowColor=colors[p.type];ctx.fillStyle=colors[p.type];ctx.beginPath();ctx.arc(p.x+12,p.y+12,11,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#02030b';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(p.type[0],p.x+12,p.y+16)});ctx.shadowBlur=12;ctx.shadowColor=shield?'#ffe600':'#fff';ctx.fillStyle='#fff';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);balls.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()});ctx.shadowBlur=0;if(shield){ctx.fillStyle='#ffe600';ctx.fillRect(4,H-6,W-8,3)}if(!playing){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px Arial';ctx.fillText(message,W/2,H/2);ctx.font='bold 16px Arial';ctx.fillText('Press Enter or RESTART',W/2,H/2+32)}}function loop(t){if(!playing)return;const dt=Math.min((t-last)/16.67,1.5);last=t;expirePower();update(dt);if(playing){sync();draw();raf=requestAnimationFrame(loop)}}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' ')launch();if(e.key==='Enter'&&!playing)reset()});addEventListener('keyup',e=>keys.delete(e.key));c.addEventListener('pointermove',e=>{const q=c.getBoundingClientRect();movePaddle((e.clientX-q.left)*W/q.width)});c.addEventListener('pointerdown',e=>{const q=c.getBoundingClientRect();movePaddle((e.clientX-q.left)*W/q.width);launch()});document.getElementById('restart').onclick=reset;reset()})()</script></body></html>
