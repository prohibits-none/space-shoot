<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON BREAKOUT</title><link rel="stylesheet" href="arcade.css"><style>body{touch-action:none}.wrap{max-width:600px;margin:auto;text-align:center}.game{display:block;width:min(94vw,560px);height:auto;margin:12px auto;border:2px solid #00eaff;border-radius:18px;background:#02030b;box-shadow:0 0 28px #00eaff33}.hud{font-weight:900;margin:8px}.help{color:#9fc5e8;font-size:14px}</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><div class="wrap"><h1>🧱 NEON BREAKOUT</h1><p>Destroy every block and keep the ball alive.</p><div class="hud">SCORE <b id="score">0</b> · BEST <b id="best">0</b> · LIVES <b id="lives">3</b></div><canvas id="game" class="game" width="560" height="620"></canvas><p class="help">← → / A D to move • Mouse/touch to aim paddle • Tap to launch</p><button id="restart">RESTART</button></div></main><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),W=c.width,H=c.height;let paddle,ball,bricks,score,lives,run,raf,last,keys=new Set(),pointerX=null;const bestKey='neonBreakoutBest';document.getElementById('best').textContent=localStorage.getItem(bestKey)||0;function reset(){cancelAnimationFrame(raf);paddle={x:W/2-55,y:H-42,w:110,h:14,s:8};ball={x:W/2,y:H-65,vx:3.1,vy:-4.2,r:8,stuck:true};bricks=[];for(let r=0;r<7;r++)for(let col=0;col<9;col++)bricks.push({x:30+col*56,y:65+r*27,w:48,h:19,on:true});score=0;lives=3;run=true;last=performance.now();sync();raf=requestAnimationFrame(loop)}function sync(){scoreEl.textContent=score;livesEl.textContent=lives;bestEl.textContent=localStorage.getItem(bestKey)||0}const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best');function launch(){if(ball.stuck)ball.stuck=false}function movePaddle(x){paddle.x=Math.max(10,Math.min(W-paddle.w-10,x-paddle.w/2));if(ball.stuck)ball.x=paddle.x+paddle.w/2}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' ')launch();if(e.key==='Enter'&&!run)reset()});addEventListener('keyup',e=>keys.delete(e.key));c.addEventListener('pointermove',e=>{const q=c.getBoundingClientRect();movePaddle((e.clientX-q.left)*W/q.width);pointerX=e.clientX});c.addEventListener('pointerdown',e=>{const q=c.getBoundingClientRect();movePaddle((e.clientX-q.left)*W/q.width);launch()});document.getElementById('restart').onclick=reset;function draw(){g.fillStyle='#02030b';g.fillRect(0,0,W,H);g.shadowBlur=14;bricks.forEach((b,i)=>{if(!b.on)return;g.shadowColor=i%2?'#ff3cf2':'#00eaff';g.fillStyle=i%2?'#ff3cf2':'#00eaff';g.fillRect(b.x,b.y,b.w,b.h)});g.shadowColor='#fff';g.fillStyle='#fff';g.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();g.shadowBlur=0;if(!run){g.fillStyle='#fff';g.textAlign='center';g.font='bold 30px Arial';g.fillText(bricks.some(b=>b.on)?'GAME OVER':'YOU WIN!',W/2,H/2)}}function loop(t){if(!run){draw();return}const dt=Math.min((t-last)/16.67,2);last=t;if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A'))paddle.x-=paddle.s*dt;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D'))paddle.x+=paddle.s*dt;paddle.x=Math.max(10,Math.min(W-paddle.w-10,paddle.x));if(ball.stuck)ball.x=paddle.x+paddle.w/2;else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r||ball.x>W-ball.r){ball.vx*=-1;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x))}if(ball.y<ball.r){ball.vy=Math.abs(ball.vy);ball.y=ball.r}if(ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5.2;ball.vy=-Math.max(3.5,Math.abs(ball.vy));ball.y=paddle.y-ball.r}for(const b of bricks)if(b.on&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.on=false;score+=10;ball.vy*=-1;break}if(ball.y>H+20){lives--;if(lives<=0){run=false;const best=Math.max(score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,best)}else{ball={x:W/2,y:H-65,vx:3.1,vy:-4.2,r:8,stuck:true}}}if(!bricks.some(b=>b.on)){run=false;const best=Math.max(score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,best)}}sync();draw();if(run)raf=requestAnimationFrame(loop)}reset()})()</script></body></html>
