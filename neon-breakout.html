<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON BREAKOUT</title><link rel="stylesheet" href="arcade.css"><style>body{touch-action:none}.wrap{max-width:600px;margin:auto;text-align:center}.game{display:block;width:min(94vw,560px);height:auto;margin:12px auto;border:2px solid #00eaff;border-radius:18px;background:#02030b;box-shadow:0 0 28px #00eaff33}.hud{font-weight:900;margin:8px}.help{color:#9fc5e8;font-size:14px}.powerLegend{font-size:12px;color:#a8c9e8;line-height:1.5;margin:4px auto 8px;max-width:560px}.powerLegend b{margin:0 4px}</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><div class="wrap"><h1>🧱 NEON BREAKOUT</h1><p>Destroy every block, catch power-ups and survive the chaos.</p><div class="hud">SCORE <b id="score">0</b> · BEST <b id="best">0</b> · LIVES <b id="lives">3</b> · ⚡ <b id="power">NONE</b></div><div class="powerLegend"><b>🔵 WIDE</b><b>🟣 MULTI</b><b>🟢 SLOW</b><b>🟡 SHIELD</b><b>🔴 FAST</b><b>⚫ SHRINK</b><b>🧲 CHAOS</b></div><canvas id="game" class="game" width="560" height="620"></canvas><p class="help">← → / A D to move • Mouse/touch to control • Space/tap to launch</p><button id="restart">RESTART</button></div></main><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),W=c.width,H=c.height;let paddle,ball,bricks,score,lives,run,raf,last,keys=new Set(),powerups=[],power='NONE',powerUntil=0,shield=0,multi=0;const bestKey='neonBreakoutBest',scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best'),powerEl=document.getElementById('power');bestEl.textContent=localStorage.getItem(bestKey)||0;function reset(){cancelAnimationFrame(raf);paddle={x:W/2-55,y:H-42,w:110,h:14,s:8,baseW:110};ball={x:W/2,y:H-65,vx:3.1,vy:-4.2,r:8,stuck:true};bricks=[];powerups=[];score=0;lives=3;run=true;power='NONE';powerUntil=0;shield=0;multi=0;last=performance.now();sync();raf=requestAnimationFrame(loop)}function sync(){scoreEl.textContent=score;livesEl.textContent=lives;bestEl.textContent=localStorage.getItem(bestKey)||0;powerEl.textContent=power}function launch(){if(ball.stuck)ball.stuck=false}function movePaddle(x){paddle.x=Math.max(10,Math.min(W-paddle.w-10,x-paddle.w/2));if(ball.stuck)ball.x=paddle.x+paddle.w/2}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' ')launch();if(e.key==='Enter'&&!run)reset()});addEventListener('keyup',e=>keys.delete(e.key));c.addEventListener('pointermove',e=>{const q=c.getBoundingClientRect();movePaddle((e.clientX-q.left)*W/q.width)});c.addEventListener('pointerdown',e=>{const q=c.getBoundingClientRect();movePaddle((e.clientX-q.left)*W/q.width);launch()});document.getElementById('restart').onclick=reset;function addPower(x,y){const types=['wide','multi','slow','shield','fast','shrink','chaos'];const type=types[Math.floor(Math.random()*types.length)];powerups.push({x,y,type,vy:2.1,w:22,h:22})}function activate(type){const now=performance.now();if(type==='wide'){paddle.w=Math.min(paddle.w*1.65,185);power='WIDE';powerUntil=now+8000}else if(type==='multi'){multi=2;power='MULTI';powerUntil=now+10000}else if(type==='slow'){ball.vx*=.58;ball.vy*=.58;power='SLOW';powerUntil=now+7000}else if(type==='shield'){shield=1;power='SHIELD';powerUntil=now+10000}else if(type==='fast'){ball.vx*=1.55;ball.vy*=1.55;power='FAST';powerUntil=now+6500}else if(type==='shrink'){paddle.w=Math.max(48,paddle.w*.52);power='SHRINK';powerUntil=now+7000}else if(type==='chaos'){ball.vx+=(Math.random()-.5)*6;ball.vy+=(Math.random()-.5)*3;power='CHAOS';powerUntil=now+5000}sync()}function expirePower(){if(!powerUntil||performance.now()<powerUntil)return;if(power==='wide'||power==='shrink')paddle.w=paddle.baseW;if(power==='multi')multi=0;power='NONE';powerUntil=0;sync()}function reflectFromPaddle(){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5.8;ball.vy=-Math.max(3.5,Math.abs(ball.vy));ball.y=paddle.y-ball.r}function draw(){g.fillStyle='#02030b';g.fillRect(0,0,W,H);g.shadowBlur=14;bricks.forEach((b,i)=>{if(!b.on)return;g.shadowColor=i%2?'#ff3cf2':'#00eaff';g.fillStyle=i%2?'#ff3cf2':'#00eaff';g.fillRect(b.x,b.y,b.w,b.h)});powerups.forEach(p=>{const map={wide:['#00eaff','W'],multi:['#ff3cf2','M'],slow:['#00ff88','S'],shield:['#ffe600','◆'],fast:['#ff5533','F'],shrink:['#111','↓'],chaos:['#aa55ff','?']};g.shadowColor=map[p.type][0];g.fillStyle=map[p.type][0];g.fillRect(p.x,p.y,p.w,p.h);g.shadowBlur=0;g.fillStyle=p.type==='shrink'?'#fff':'#02030b';g.font='bold 13px Arial';g.textAlign='center';g.fillText(map[p.type][1],p.x+p.w/2,p.y+15)});g.shadowBlur=16;g.shadowColor=power==='SHIELD'?'#ffe600':'#fff';g.fillStyle='#fff';g.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();g.shadowBlur=0;if(shield){g.strokeStyle='#ffe600';g.lineWidth=3;g.strokeRect(4,H-7,W-8,4)}if(!run){g.fillStyle='#fff';g.textAlign='center';g.font='bold 30px Arial';g.fillText(bricks.some(b=>b.on)?'GAME OVER':'YOU WIN!',W/2,H/2);g.font='bold 16px Arial';g.fillText('Press Enter or Restart',W/2,H/2+30)}}function hitBrick(b){b.on=false;score+=10;if(Math.random()<.24)addPower(b.x+b.w/2-11,b.y+b.h/2);ball.vy*=-1;if(multi){let clone={x:ball.x,y:ball.y,vx:-ball.vx*.9,vy:ball.vy,r:ball.r,stuck:false};multi=clone}}function loop(t){if(!run){draw();return}const dt=Math.min((t-last)/16.67,2);last=t;expirePower();if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A'))paddle.x-=paddle.s*dt;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D'))paddle.x+=paddle.s*dt;paddle.x=Math.max(10,Math.min(W-paddle.w-10,paddle.x));if(ball.stuck)ball.x=paddle.x+paddle.w/2;else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r||ball.x>W-ball.r){ball.vx*=-1;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x))}if(ball.y<ball.r){ball.vy=Math.abs(ball.vy);ball.y=ball.r}if(ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0)reflectFromPaddle();for(const b of bricks)if(b.on&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){hitBrick(b);break}if(ball.y>H+20){if(shield){shield=0;ball={x:paddle.x+paddle.w/2,y:paddle.y-10,vx:3.1,vy:-4.2,r:8,stuck:false};power='NONE';powerUntil=0}else{lives--;if(lives<=0){run=false;const best=Math.max(score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,best)}else ball={x:paddle.x+paddle.w/2,y:paddle.y-10,vx:3.1,vy:-4.2,r:8,stuck:true}}}powerups.forEach(p=>p.y+=p.vy*dt);for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];if(p.x<paddle.x+paddle.w&&p.x+p.w>paddle.x&&p.y+p.h>paddle.y&&p.y<paddle.y+paddle.h){activate(p.type);powerups.splice(i,1)}else if(p.y>H+30)powerups.splice(i,1)}}if(!bricks.some(b=>b.on)){run=false;const best=Math.max(score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,best)}sync();draw();if(run)raf=requestAnimationFrame(loop)}for(let r=0;r<7;r++)for(let col=0;col<9;col++)bricks.push({x:30+col*56,y:65+r*27,w:48,h:19,on:true});reset()})()</script></body></html>
