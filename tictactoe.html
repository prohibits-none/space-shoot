<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON O|X</title><link rel="stylesheet" href="arcade.css"><style>body{touch-action:manipulation}.arcade{padding-bottom:30px}.mode{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.mode button,.cell,.gameBtn2{border:2px solid #00eaff;background:#06132b;color:#fff;border-radius:14px;font-weight:900}.mode button{padding:12px 18px}.mode .active{background:#00eaff22;box-shadow:0 0 20px #00eaff55}.board{width:360px;height:360px;margin:20px auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px}.cell{width:112px;height:112px;min-width:112px;min-height:112px;font-size:82px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 0 25px #00eaff12,0 0 15px #00eaff22;transition:background .15s,box-shadow .15s}.cell:hover{background:#0b2040}.cell.x{color:#00eaff;text-shadow:0 0 12px #00eaff,0 0 35px #00eaff;border-color:#00eaff}.cell.o{color:#ff3cf2;text-shadow:0 0 12px #ff3cf2,0 0 35px #ff3cf2;border-color:#ff3cf2}.status{font-size:20px;font-weight:900;min-height:28px}.scoreline{color:#a8c9e8;margin:8px}.gameBtn2{padding:13px 24px;margin:5px;cursor:pointer}.win{animation:pulse .55s infinite alternate}@keyframes pulse{to{box-shadow:0 0 30px currentColor}}@media(max-width:420px){.board{width:360px;height:360px;margin-left:calc(50% - 180px);margin-right:calc(50% - 180px)}.cell{width:112px;height:112px;min-width:112px;min-height:112px}}</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><h1>⭕ NEON O|X</h1><p>Classic Tic Tac Toe with neon arcade graphics.</p><div class="mode"><button id="pvp" class="active">👥 TWO PLAYER</button><button id="cpu">🤖 VS COMPUTER</button></div><div class="status" id="status">Player X's turn</div><div class="scoreline">X: <b id="sx">0</b> &nbsp; O: <b id="so">0</b> &nbsp; Draws: <b id="sd">0</b></div><div class="board" id="board"></div><button class="gameBtn2" id="new">NEW ROUND</button><button class="gameBtn2" id="reset">RESET SCORE</button></main><script>const board=document.getElementById('board'),status=document.getElementById('status');let cells=[],turn='X',over=false,mode='pvp',scores={X:0,O:0,D:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function build(){board.innerHTML='';cells=Array(9).fill('');for(let i=0;i<9;i++){let b=document.createElement('button');b.className='cell';b.onclick=()=>play(i);board.appendChild(b)}}function winner(){for(const [a,b,c]of wins)if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c])return [cells[a],[a,b,c]];return cells.every(Boolean)?['D',[]]:null}function render(win=[]){[...board.children].forEach((b,i)=>{b.textContent=cells[i];b.className='cell '+(cells[i]||'');if(win.includes(i))b.classList.add('win')});let w=winner();if(w){over=true;if(w[0]==='D'){scores.D++;status.textContent='🤝 DRAW!'}else{scores[w[0]]++;status.textContent='🏆 Player '+w[0]+' WINS!'}document.getElementById('sx').textContent=scores.X;document.getElementById('so').textContent=scores.O;document.getElementById('sd').textContent=scores.D}}function play(i){if(over||cells[i]||(mode==='cpu'&&turn==='O'))return;cells[i]=turn;let w=winner();if(w){render(w[1]);return}turn=turn==='X'?'O':'X';status.textContent=mode==='cpu'&&turn==='O'?'🤖 Computer is thinking…':`Player ${turn}'s turn`;render();if(mode==='cpu'&&turn==='O')setTimeout(ai,300)}function ai(){if(over)return;let empt=cells.map((v,i)=>v?null:i).filter(v=>v!==null);let move=find('O')??find('X')??(cells[4]?null:4);if(move===null)move=empt[Math.floor(Math.random()*empt.length)];if(move!==undefined){cells[move]='O';let w=winner();if(w){render(w[1]);return}turn='X';status.textContent="Player X's turn";render()}}function find(p){for(const line of wins){let vals=line.map(i=>cells[i]),n=vals.filter(v=>v===p).length,e=vals.findIndex(v=>!v);if(n===2&&e>=0)return line[e]}return null}function resetRound(){turn='X';over=false;cells=Array(9).fill('');status.textContent="Player X's turn";render()}document.getElementById('new').onclick=resetRound;document.getElementById('reset').onclick=()=>{scores={X:0,O:0,D:0};document.getElementById('sx').textContent=0;document.getElementById('so').textContent=0;document.getElementById('sd').textContent=0;resetRound()};document.getElementById('pvp').onclick=()=>{mode='pvp';pvp.classList.add('active');cpu.classList.remove('active');resetRound()};document.getElementById('cpu').onclick=()=>{mode='cpu';cpu.classList.add('active');pvp.classList.remove('active');resetRound()};build();resetRound()</script></body></html>
