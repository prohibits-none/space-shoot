<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON FLAP</title><link rel="stylesheet" href="arcade.css"><style>body{touch-action:none}.wrap{max-width:560px;margin:auto;text-align:center}.game{display:block;width:min(56vw,312px);height:auto;margin:12px auto;border:2px solid #ff3cf2;border-radius:18px;background:#050617;box-shadow:0 0 28px #ff3cf233}.hud{font-weight:900}.help{color:#9fc5e8;font-size:14px}@media(max-width:800px){.game{width:min(94vw,520px)}}</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><div class="wrap"><h1>🪽 NEON FLAP</h1><p>Tap, click or press Space to fly through the gates.</p><div class="hud">SCORE <b id="score">0</b> · BEST <b id="best">0</b></div><canvas id="game" class="game" width="520" height="700"></canvas><p class="help">SPACE / click / tap = flap • R = restart</p><button id="restart">RESTART</button></div></main><script src="audio.js"></script><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),W=c.width,H=c.height;let bird,pipes,score,run,raf,last,spawnTimer;const bestKey='neonFlapBest',scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');bestEl.textContent=localStorage.getItem(bestKey)||0;function reset(){cancelAnimationFrame(raf);bird={x:130,y:H/2,vy:0,r:18};pipes=[];score=0;run=true;spawnTimer=0;last=performance.now();sync();raf=requestAnimationFrame(loop)}function sync(){scoreEl.textContent=score;bestEl.textContent=localStorage.getItem(bestKey)||0}function flap(){if(!run){reset();return}bird.vy=-7.2}addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();flap()}if(e.key.toLowerCase()==='r')reset()});c.addEventListener('pointerdown',flap);document.getElementById('restart').onclick=reset;function addPipe(){const gap=175,min=80,max=H-gap-100,top=min+Math.random()*(max-min);pipes.push({x:W+20,w:72,top,gap,passed:false})}function draw(){g.fillStyle='#050617';g.fillRect(0,0,W,H);for(let i=0;i<70;i++){g.fillStyle=i%3?'#16204b':'#fff';g.fillRect((i*83)%W,(i*47)%H,2,2)}pipes.forEach(p=>{g.shadowBlur=16;g.shadowColor='#00eaff';g.fillStyle='#00eaff';g.fillRect(p.x,0,p.w,p.top);g.fillRect(p.x,p.top+p.gap,p.w,H-(p.top+p.gap))});g.shadowColor='#ff3cf2';g.fillStyle='#ff3cf2';g.beginPath();g.arc(bird.x,bird.y,bird.r,0,Math.PI*2);g.fill();g.shadowBlur=0;if(!run){g.fillStyle='#fff';g.textAlign='center';g.font='bold 32px Arial';g.fillText('GAME OVER',W/2,H/2);g.font='bold 18px Arial';g.fillText('Tap to restart',W/2,H/2+34)}}function loop(t){if(!run){draw();return}const dt=Math.min((t-last)/16.67,2);last=t;bird.vy+=0.38*dt;bird.y+=bird.vy*dt;spawnTimer+=16.67*dt;if(spawnTimer>1450){spawnTimer=0;addPipe()}pipes.forEach(p=>{p.x-=3.2*dt;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;sync()}});pipes=pipes.filter(p=>p.x>-100);let hit=bird.y-bird.r<0||bird.y+bird.r>H;for(const p of pipes)if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+p.w&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap))hit=true;if(hit){run=false;const best=Math.max(score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,best);sync()}draw();if(run)raf=requestAnimationFrame(loop)}reset()})()</script></body></html>
