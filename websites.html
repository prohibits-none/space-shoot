<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Useful Websites</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f5f7fa;color:#18202a}.wrap{width:min(1240px,92vw);margin:auto}.top{padding:30px 0 15px}.back{color:#66717d;text-decoration:none;font-weight:800}.hero{padding:25px 0 18px}.hero h1{font-size:clamp(42px,7vw,72px);letter-spacing:-4px;margin:0}.hero p{color:#66717d;font-size:18px;line-height:1.5}.search{width:100%;padding:16px 18px;border:1px solid #dfe4e8;border-radius:14px;font-size:16px;outline:none}.cats{display:flex;gap:8px;overflow:auto;padding:18px 0}.cat{border:1px solid #dfe4e8;background:white;border-radius:999px;padding:9px 15px;white-space:nowrap;cursor:pointer;font-weight:800}.cat.active{background:#18202a;color:white}.count{color:#7a8590;font-size:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:60px}.site{background:#fff;border:1px solid #e4e8ec;border-radius:18px;padding:18px;min-height:210px;display:flex;flex-direction:column;transition:.2s}.site:hover{transform:translateY(-5px);box-shadow:0 15px 35px #10182812}.logo{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;background:#f0f3f6;overflow:hidden}.logo img{width:38px;height:38px;object-fit:contain}.fallback{font-size:24px;font-weight:900}.site h3{margin:13px 0 5px}.tag{font-size:11px;font-weight:900;letter-spacing:.7px;color:#6b7280}.site p{color:#697582;font-size:14px;line-height:1.4;margin:6px 0 15px;flex:1}.go{display:block;text-align:center;background:#18202a;color:#fff;text-decoration:none;border-radius:10px;padding:10px;font-weight:900}.hidden{display:none}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{letter-spacing:-2px}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">← Back to Toolbox Arcade</a></div><section class="hero"><h1>Useful Websites</h1><p>Popular websites organized by subject — coding, anime, games, AI, learning, entertainment, design, social and more.</p><input id="search" class="search" placeholder="Search websites..."></section><div class="cats" id="cats"></div><div id="count" class="count"></div><section id="grid" class="grid"></section></main><script>const sites=[

];const cats=[['all','All'],['coding','💻 Coding'],['anime','🍥 Anime'],['games','🎮 Games'],['ai','🤖 AI'],['video','▶️ Video'],['music','🎵 Music'],['entertainment','🎬 Entertainment'],['learning','📚 Learning'],['design','🎨 Design'],['social','💬 Social'],['productivity','📋 Productivity'],['search','🔎 Search'],['utilities','🛠️ Utilities']];const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),catbar=document.getElementById('cats');let cat='all';catbar.innerHTML=cats.map(c=>`<button class="cat ${c[0]==='all'?'active':''}" data-cat="${c[0]}">${c[1]}</button>`).join('');function render(){const q=search.value.toLowerCase().trim();const a=sites.filter(s=>(cat==='all'||s[3]===cat)&&(!q||s[0].toLowerCase().includes(q)||s[1].toLowerCase().includes(q)||s[2].toLowerCase().includes(q)));count.textContent=a.length+' websites';grid.innerHTML=a.map(s=>`<article class="site"><div class="logo"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(s[4]).hostname)}&sz=128" alt="${s[0]} logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">${s[0].slice(0,2).toUpperCase()}</span></div><span class="tag">${s[3].toUpperCase()}</span><h3>${s[0]}</h3><p>${s[2]}</p><a class="go" href="${s[4]}" target="_blank" rel="noopener noreferrer">Visit →</a></article>`).join('')}document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()});search.oninput=render;render()</script></body></html>
