<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Useful Websites</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f5f7fa;color:#18202a}.wrap{width:min(1200px,92vw);margin:auto}.top{padding:42px 0 22px}.back{color:#66717d;text-decoration:none;font-weight:800}.hero{padding:30px 0 25px}.hero h1{font-size:clamp(42px,7vw,72px);letter-spacing:-4px;margin:0}.hero p{color:#66717d;font-size:18px}.search{width:100%;padding:16px 18px;border:1px solid #dfe4e8;border-radius:14px;font-size:16px;outline:none}.cats{display:flex;gap:8px;overflow:auto;padding:18px 0}.cat{border:1px solid #dfe4e8;background:white;border-radius:999px;padding:9px 15px;white-space:nowrap;cursor:pointer;font-weight:800}.cat.active{background:#18202a;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:60px}.site{background:#fff;border:1px solid #e4e8ec;border-radius:18px;padding:18px;min-height:190px;display:flex;flex-direction:column;transition:.2s}.site:hover{transform:translateY(-5px);box-shadow:0 15px 35px #10182812}.logo{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:#f0f3f6;font-size:28px;font-weight:900}.site h3{margin:13px 0 5px}.site p{color:#697582;font-size:14px;line-height:1.4;margin:0 0 15px;flex:1}.go{display:block;text-align:center;background:#18202a;color:#fff;text-decoration:none;border-radius:10px;padding:10px;font-weight:900}.count{color:#7a8590;font-size:14px;margin-bottom:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{letter-spacing:-2px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">← Back to Toolbox Arcade</a></div><section class="hero"><h1>Useful Websites</h1><p>40+ popular places on the web, organized so you can find what you need fast.</p><input id="search" class="search" placeholder="Search websites..."></section><div class="cats"><button class="cat active" data-cat="all">All</button><button class="cat" data-cat="search">Search</button><button class="cat" data-cat="ai">AI</button><button class="cat" data-cat="social">Social</button><button class="cat" data-cat="video">Video</button><button class="cat" data-cat="learning">Learning</button><button class="cat" data-cat="dev">Developer</button><button class="cat" data-cat="design">Design</button><button class="cat" data-cat="work">Productivity</button></div><div id="count" class="count"></div><section id="grid" class="grid"></section></main><script>const sites=[['Google','Search the web and find almost anything.','🔎','search','https://www.google.com'],['YouTube','Videos, tutorials, music and creators.','▶️','video','https://www.youtube.com'],['Wikipedia','Free encyclopedia and knowledge reference.','W','learning','https://www.wikipedia.org'],['ChatGPT','AI assistant for writing, learning and ideas.','AI','ai','https://chatgpt.com'],['Gemini','Google AI assistant for research and creation.','✦','ai','https://gemini.google.com'],['Claude','AI assistant for writing, analysis and coding.','C','ai','https://claude.ai'],['Canva','Design presentations, posters, thumbnails and more.','C','design','https://www.canva.com'],['GitHub','Code hosting, collaboration and open source.','◖','dev','https://github.com'],['Stack Overflow','Questions and answers for programmers.','SO','dev','https://stackoverflow.com'],['MDN Web Docs','Trusted web development documentation.','MDN','dev','https://developer.mozilla.org'],['CodePen','Build and share HTML, CSS and JavaScript.','CP','dev','https://codepen.io'],['Replit','Code and run projects in the browser.','R','dev','https://replit.com'],['Reddit','Communities and discussions about almost anything.','r/','social','https://www.reddit.com'],['Instagram','Photos, reels, creators and messages.','◎','social','https://www.instagram.com'],['Facebook','Connect with people, groups and pages.','f','social','https://www.facebook.com'],['X','Posts, news and conversations.','𝕏','social','https://x.com'],['LinkedIn','Professional networking and careers.','in','work','https://www.linkedin.com'],['WhatsApp Web','Messaging from your browser.','◉','social','https://web.whatsapp.com'],['Discord','Communities, chat and voice.','◈','social','https://discord.com'],['Twitch','Live streams, gaming and communities.','T','video','https://www.twitch.tv'],['Netflix','Movies, shows and documentaries.','N','video','https://www.netflix.com'],['Spotify','Music, podcasts and playlists.','●','video','https://open.spotify.com'],['Prime Video','Movies and TV streaming.','▶','video','https://www.primevideo.com'],['Khan Academy','Free lessons and practice for learners.','K','learning','https://www.khanacademy.org'],['Coursera','Online courses and professional learning.','C','learning','https://www.coursera.org'],['edX','University-level online courses.','x','learning','https://www.edx.org'],['Duolingo','Learn languages with short interactive lessons.','🦉','learning','https://www.duolingo.com'],['Google Scholar','Search academic papers and research.','🎓','learning','https://scholar.google.com'],['Notion','Notes, docs, projects and databases.','N','work','https://www.notion.so'],['Trello','Visual boards for organizing projects.','T','work','https://trello.com'],['Google Drive','Store and collaborate on files online.','△','work','https://drive.google.com'],['Google Docs','Create and edit documents online.','D','work','https://docs.google.com'],['Zoom','Video meetings and collaboration.','Z','work','https://zoom.us'],['Dropbox','Cloud storage and file sharing.','◆','work','https://www.dropbox.com'],['Figma','Collaborative interface and product design.','F','design','https://www.figma.com'],['Adobe Express','Quick graphic and content creation.','A','design','https://www.adobe.com/express'],['Unsplash','Free high-quality photography.','U','design','https://unsplash.com'],['Pexels','Free stock photos and videos.','P','design','https://www.pexels.com'],['Pinterest','Discover and save visual ideas.','P','design','https://www.pinterest.com'],['Google Maps','Maps, places, routes and directions.','📍','search','https://maps.google.com'],['Google Translate','Translate text and websites.','文','search','https://translate.google.com'],['Speedtest','Test your internet connection speed.','⚡','search','https://www.speedtest.net'],['Internet Archive','Explore archived web pages and digital collections.','🕰️','learning','https://archive.org'],['Proton Mail','Privacy-focused email.','✉️','work','https://proton.me/mail'],['DeepL','High-quality translation service.','D','search','https://www.deepl.com'],['Perplexity','AI-powered answer and research engine.','P','ai','https://www.perplexity.ai']];const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count');let cat='all';function render(){let q=search.value.toLowerCase();let a=sites.filter(s=>(cat==='all'||s[3]===cat)&&(!q||s[0].toLowerCase().includes(q)||s[1].toLowerCase().includes(q)));count.textContent=a.length+' websites';grid.innerHTML=a.map(s=>`<article class="site"><div class="logo">${s[2]}</div><h3>${s[0]}</h3><p>${s[1]}</p><a class="go" href="${s[4]}" target="_blank" rel="noopener">Visit →</a></article>`).join('')}document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()});search.oninput=render;render()</script></body></html>
