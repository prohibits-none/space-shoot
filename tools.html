<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolbox — Tools</title><style>body{margin:0;background:#f5f7fa;color:#17202a;font-family:system-ui,Arial}.wrap{width:min(1050px,92vw);margin:auto;padding:35px 0 70px}.back{color:#007c88;font-weight:800;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.tool{background:white;border:1px solid #dfe5ea;border-radius:18px;padding:20px;box-shadow:0 8px 25px #0000000a}.tool h2{margin:0 0 10px}.neon{border-color:#00eaff;box-shadow:0 0 18px #00eaff22}.full{grid-column:1/-1}input,textarea,button,select{font:inherit}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd4dc;border-radius:10px;box-sizing:border-box;margin:6px 0}button{padding:10px 14px;border:1px solid #00eaff;border-radius:10px;background:#07131a;color:#8fffff;font-weight:800;cursor:pointer}.out{margin-top:10px;padding:12px;border-radius:10px;background:#f0f3f6;white-space:pre-wrap}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc button{height:48px}.calc .display{grid-column:1/-1;background:#101820;color:white;border-color:#101820;text-align:right;font-size:24px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.big{font-size:42px;font-weight:900;text-align:center;margin:12px}.danger{border-color:#ff3cf2;color:#ff3cf2}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Toolbox home</a><h1>⚡ Tools</h1><p>Useful utilities plus a few ridiculous ones.</p><div class="grid"><section class="tool neon" id="calculator"><h2>🧮 Calculator</h2><div class="calc"><input class="display" id="display" value="0" readonly><button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button onclick="press('/')">÷</button><button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button onclick="press('*')">×</button><button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button onclick="press('-')">−</button><button onclick="press('0')">0</button><button onclick="press('.')">.</button><button onclick="calc()">=</button><button onclick="press('+')">+</button><button onclick="clearCalc()">C</button></div></section><section class="tool" id="text"><h2>📝 Text Lab</h2><textarea id="txt" rows="8" placeholder="Type or paste text..."></textarea><div class="out" id="stats">0 words · 0 characters · 0 lines · 0 min read</div></section><section class="tool" id="json"><h2>🧩 JSON Beautifier</h2><textarea id="jsonin" rows="8" placeholder='{"hello":"world"}'></textarea><div class="row"><button onclick="formatJson()">Format</button><button onclick="minifyJson()">Minify</button></div><div class="out" id="jsonout"></div></section><section class="tool" id="random"><h2>🎲 Random Generator</h2><div class="row"><button onclick="randomNum()">Random number</button><button onclick="coin()">Flip coin</button><button onclick="dice()">Roll dice</button></div><div class="big" id="randomOut">?</div></section><section class="tool" id="pomodoro"><h2>⏱️ Pomodoro</h2><div class="big" id="timer">25:00</div><div class="row"><button onclick="startTimer()">Start</button><button onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Reset</button></div></section><section class="tool full neon" id="playground"><h2>🌀 Screen Playground</h2><p>Press a button. It only affects this page.</p><div class="row"><button onclick="document.body.animate([{transform:'rotate(0)'},{transform:'rotate(1deg)'},{transform:'rotate(0)'}],{duration:500})">Wiggle</button><button onclick="document.body.animate([{filter:'none'},{filter:'invert(1)'},{filter:'none'}],{duration:700})">Invert</button><button onclick="document.body.animate([{transform:'scale(1)'},{transform:'scale(.97)'},{transform:'scale(1)'}],{duration:450})">Bounce</button><button class="danger" onclick="party()">PARTY MODE</button></div></section></div></main><script>let expr='';const d=document.getElementById('display');function press(x){expr+=x;d.value=expr}function clearCalc(){expr='';d.value='0'}function calc(){try{if(!/^[0-9+*/.() -]+$/.test(expr))throw 0;expr=String(Function('return '+expr)());d.value=expr}catch{d.value='Error';expr=''}}document.addEventListener('keydown',e=>{if(/[0-9+*/().-]/.test(e.key))press(e.key);if(e.key==='Enter')calc();if(e.key==='Escape')clearCalc()});const txt=document.getElementById('txt');txt.oninput=()=>{let s=txt.value;let w=s.trim()?s.trim().split(/\s+/).length:0;document.getElementById('stats').textContent=`${w} words · ${s.length} characters · ${s.split('\n').length} lines · ${Math.max(0,Math.ceil(w/200))} min read`};function formatJson(){try{document.getElementById('jsonout').textContent=JSON.stringify(JSON.parse(document.getElementById('jsonin').value),null,2)}catch{document.getElementById('jsonout').textContent='Invalid JSON'}}function minifyJson(){try{document.getElementById('jsonout').textContent=JSON.stringify(JSON.parse(document.getElementById('jsonin').value))}catch{document.getElementById('jsonout').textContent='Invalid JSON'}}function randomNum(){document.getElementById('randomOut').textContent=Math.floor(Math.random()*100)+1}function coin(){document.getElementById('randomOut').textContent=Math.random()<.5?'HEADS':'TAILS'}function dice(){document.getElementById('randomOut').textContent=Math.floor(Math.random()*6)+1}let left=1500,tm;function showTime(){document.getElementById('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}function startTimer(){if(tm)return;tm=setInterval(()=>{if(left>0){left--;showTime()}else{clearInterval(tm);tm=null;alert('Focus session complete!')}},1000)}function pauseTimer(){clearInterval(tm);tm=null}function resetTimer(){pauseTimer();left=1500;showTime()}function party(){for(let i=0;i<35;i++){let x=document.createElement('i');x.textContent=['✦','★','●','◆'][i%4];x.style='position:fixed;left:'+Math.random()*100+'vw;top:-20px;font-size:28px;z-index:99;color:hsl('+Math.random()*360+' 90% 60%);animation:fall 2s linear forwards';document.body.append(x);setTimeout(()=>x.remove(),2100)}}const st=document.createElement('style');st.textContent='@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}';document.head.append(st)</script></body></html>
