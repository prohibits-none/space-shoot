<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON 2048</title><link rel="stylesheet" href="arcade.css"><style>body{touch-action:none}.wrap{max-width:520px;margin:auto;text-align:center}.board{width:min(92vw,460px);aspect-ratio:1;margin:15px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:9px;background:#07112a;border:2px solid #9c5cff;border-radius:18px;box-shadow:0 0 30px #9c5cff33}.tile{display:flex;align-items:center;justify-content:center;border-radius:10px;background:#0d1c38;color:#9dbbe0;font:bold clamp(20px,7vw,34px) Arial;user-select:none}.v2{background:#12385a;color:#fff}.v4{background:#174d5b;color:#fff}.v8{background:#6b2f72;color:#fff}.v16{background:#8b245c;color:#fff}.v32{background:#a42d4c;color:#fff}.v64{background:#bd3a37;color:#fff}.v128{background:#c26b25;color:#fff}.v256{background:#c49b28;color:#fff}.v512,.v1024,.v2048{background:#e0c13b;color:#06101f}.hud{font-weight:900;margin:8px}.help{color:#9fc5e8;font-size:14px}</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><div class="wrap"><h1>🔢 NEON 2048</h1><p>Merge matching tiles. Reach 2048.</p><div class="hud">SCORE <b id="score">0</b> · BEST <b id="best">0</b></div><div id="board" class="board"></div><p id="status" class="help">Swipe or use arrow keys</p><button id="restart">NEW GAME</button></div></main><script>(()=>{const board=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),key='neon2048Best';let a,score,over,won=false,startX=0,startY=0;bestEl.textContent=localStorage.getItem(key)||0;function reset(){a=Array.from({length:4},()=>Array(4).fill(0));score=0;over=false;won=false;add();add();render();status.textContent='Swipe or use arrow keys'}function add(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!a[r][c])e.push([r,c]);if(!e.length)return;const [r,c]=e[Math.floor(Math.random()*e.length)];a[r][c]=Math.random()<.9?2:4}function render(){board.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=document.createElement('div'),v=a[r][c];d.className='tile'+(v?' v'+v:'');d.textContent=v||'';board.appendChild(d)}scoreEl.textContent=score;const b=Math.max(score,+(localStorage.getItem(key)||0));localStorage.setItem(key,b);bestEl.textContent=b}function lineMove(line){const old=line.slice();let x=line.filter(Boolean),out=[];for(let i=0;i<x.length;i++){if(x[i]===x[i+1]){x[i]*=2;score+=x[i];i++}out.push(x[i])}while(out.length<4)out.push(0);return {out,changed:out.some((v,i)=>v!==old[i])}}function move(dir){if(over)return;let changed=false;for(let r=0;r<4;r++){let line=dir==='L'?a[r].slice():dir==='R'?a[r].slice().reverse():Array.from({length:4},(_,i)=>a[i][r]);let m=lineMove(line);if(dir==='R')m.out.reverse();if(dir==='D')m.out.reverse();if(dir==='U'||dir==='D'){for(let i=0;i<4;i++){if(a[i][r]!==m.out[i])changed=true;a[i][r]=m.out[i]}}else for(let i=0;i<4;i++){if(a[r][i]!==m.out[i])changed=true;a[r][i]=m.out[i]}}if(!changed)return;add();render();if(!won&&a.flat().includes(2048)){won=true;status.textContent='🎉 2048! Keep going!'}if(!canMove()){over=true;status.textContent='GAME OVER — press NEW GAME'}}function canMove(){for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!a[r][c]||(c<3&&a[r][c]===a[r][c+1])||(r<3&&a[r][c]===a[r+1][c]))return true;return false}addEventListener('keydown',e=>{const map={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'};if(map[e.key]){e.preventDefault();move(map[e.key])}});board.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY},{passive:true});board.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'R':'L');else move(dy>0?'D':'U')},{passive:true});document.getElementById('restart').onclick=reset;reset()})()</script></body></html>
