<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Strike</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b}#loading{position:fixed;inset:0;display:grid;place-items:center;color:#00eaff;font:700 18px Arial;letter-spacing:2px}</style>
</head>
<body>
<div id="loading">LOADING GALAXY STRIKE...</div>
<script>
fetch('https://raw.githubusercontent.com/prohibits-none/space-shoot/70ff961ffd83d31e28dfdf510a3992602433fb44/index.html')
.then(r=>{if(!r.ok)throw new Error('Game source unavailable');return r.text()})
.then(html=>{document.open();document.write(html);document.close()})
.catch(err=>{document.getElementById('loading').textContent='GAME LOAD FAILED — '+err.message})
</script>
</body>
</html>
