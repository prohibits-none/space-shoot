<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON SNAKE</title><link rel="stylesheet" href="arcade.css"><style>@media(min-width:801px){.arcade{padding-top:18px;padding-bottom:20px}.arcade h1{font-size:42px;margin:6px 0}.arcade p{margin:5px}.stats{margin:8px}.snakeCanvas{width:min(360px,72vh);height:auto;margin:10px auto}.controls{margin:6px auto}.controls button{height:42px;width:55px}.arcade>button{padding:10px;margin:8px auto}}.snakeCanvas{display:block}</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><h1>🐍 NEON SNAKE</h1><p>Eat energy orbs. Don't hit the walls or yourself.</p><div class="stats">SCORE <b id="score">0</b> · BEST <b id="best">0</b></div><canvas class="snakeCanvas" id="c" width="480" height="480"></canvas><div class="controls"><button data-k="ArrowUp">▲</button><div><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div></div><button id="restart">RESTART</button></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=24,S=20;let snake,dir,next,food,score,run,raf=0;const bestKey='neonSnakeBest';document.getElementById('best').textContent=localStorage.getItem(bestKey)||0;function reset(){cancelAnimationFrame(raf);snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir=next={x:1,y:0};score=0;food=spawn();run=true;document.getElementById('score').textContent=0;last=performance.now();raf=requestAnimationFrame(loop)}function spawn(){let f;do f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(snake&&snake.some(a=>a.x===f.x&&a.y===f.y));return f}function key(e){let k=e.key;if(k==='ArrowUp'&&dir.y!==1)next={x:0,y:-1};if(k==='ArrowDown'&&dir.y!==-1)next={x:0,y:1};if(k==='ArrowLeft'&&dir.x!==1)next={x:-1,y:0};if(k==='ArrowRight'&&dir.x!==-1)next={x:1,y:0}}addEventListener('keydown',key);document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key({key:b.dataset.k}));document.getElementById('restart').onclick=reset;function draw(){x.fillStyle='#02030b';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(0,234,255,.08)';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}x.shadowBlur=20;x.shadowColor='#ff3cf2';x.fillStyle='#ff3cf2';x.beginPath();x.arc(food.x*S+10,food.y*S+10,7,0,7);x.fill();snake.forEach((a,i)=>{x.shadowColor=i?'#00eaff':'#fff';x.fillStyle=i?'#00eaff':'#fff';x.fillRect(a.x*S+2,a.y*S+2,16,16)});x.shadowBlur=0}let last=0;function loop(t){if(!run){draw();x.fillStyle='white';x.textAlign='center';x.font='bold 28px Arial';x.fillText('GAME OVER',240,245);return}if(t-last>=105){last=t;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(a=>a.x===h.x&&a.y===h.y)){run=false;let b=Math.max(score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,b);document.getElementById('best').textContent=b}else{snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;document.getElementById('score').textContent=score;food=spawn()}else snake.pop()}}draw();if(run)raf=requestAnimationFrame(loop)}reset()</script></body></html>
