<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON DROP</title><link rel="stylesheet" href="arcade.css"></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><h1>🌀 NEON DROP</h1><p>Guide the glowing ball through the helix. Reach the bottom to clear the level.</p><div class="stats">LEVEL <b id="level">1</b> · BEST <b id="best">1</b></div><canvas id="c" width="420" height="620"></canvas><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><button id="restart">RESTART LEVEL</button></main><script>const c=document.getElementById('c'),x=c.getContext('2d');let level=1,angle=0,ballY=80,vy=0,run=true,last=0;const bestKey='helixBest';document.getElementById('best').textContent=localStorage.getItem(bestKey)||1;function reset(){ballY=80;vy=0;run=true;last=0;requestAnimationFrame(loop)}function move(v){angle+=v}onkeydown=e=>{if(e.key==='ArrowLeft')move(-.16);if(e.key==='ArrowRight')move(.16)};left.onclick=()=>move(-.22);right.onclick=()=>move(.22);restart.onclick=reset;function draw(){x.fillStyle='#03020c';x.fillRect(0,0,c.width,c.height);for(let i=0;i<10+level;i++){let y=100+i*55-(ballY%55),r=70+(i%2)*9;x.save();x.translate(210,110+i*55-(ballY%55));x.rotate(angle+i*.22);x.strokeStyle=i%4===0?'#ff3cf2':'#00eaff';x.lineWidth=12;x.shadowBlur=18;x.shadowColor=x.strokeStyle;x.beginPath();x.arc(0,0,r,0.2,Math.PI*1.75);x.stroke();x.restore()}x.shadowBlur=20;x.shadowColor='#fff';x.fillStyle='#fff';x.beginPath();x.arc(210,110,13,0,7);x.fill();x.shadowBlur=0}function loop(t){if(!run)return;if(!last)last=t;let dt=Math.min(32,t-last);last=t;vy+=.0009*dt;ballY+=vy*dt;if(ballY>520){level++;document.getElementById('level').textContent=level;localStorage.setItem(bestKey,Math.max(level,+(localStorage.getItem(bestKey)||1)));document.getElementById('best').textContent=localStorage.getItem(bestKey);ballY=80;vy=0}draw();requestAnimationFrame(loop)}reset()</script></body></html>
