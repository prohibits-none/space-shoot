<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON DROP</title><link rel="stylesheet" href="arcade.css"><style>
body{touch-action:none}.dropWrap{position:relative;width:min(420px,94vw);margin:auto}.dropWrap canvas{width:100%;margin:18px auto}.hint{color:#8db7df;font-size:13px}.controls button{touch-action:none}.overlay{position:absolute;inset:18px 0 0;display:flex;align-items:center;justify-content:center;pointer-events:none}.message{display:none;padding:22px 30px;border:2px solid #00eaff;border-radius:20px;background:#040718ee;box-shadow:0 0 30px #00eaff55}.message h2{color:#00eaff;margin:0 0 8px}.message button{pointer-events:auto}
</style></head><body><main class="arcade"><a class="back" href="index.html">← ARCADE HOME</a><h1>🌀 NEON DROP</h1><p>Rotate the tower and drop through the gaps. <b>BLACK tiles are deadly.</b></p><p class="hint">PC: hold LEFT MOUSE BUTTON and drag • Mobile: touch and drag</p><div class="stats">LEVEL <b id="level">1</b> · BEST <b id="best">1</b></div><div class="dropWrap"><canvas id="c" width="420" height="620"></canvas><div class="overlay"><div id="msg" class="message"><h2 id="msgTitle">LEVEL CLEAR!</h2><div id="msgText"></div><button id="next">NEXT LEVEL</button></div></div></div><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><button id="restart">RESTART LEVEL</button></main>
<script>
'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=420,H=620,CX=210,TOP=105,RING_GAP=62,RINGS=9,SEG=12;
let level=1,angle=0,ballY=TOP,vy=0,scroll=0,running=false,won=false,drag=false,lastX=0,fallTime=0,levels=[];
const bestKey='helixBest'; const bestEl=document.getElementById('best'),levelEl=document.getElementById('level');bestEl.textContent=localStorage.getItem(bestKey)||1;
function makeLevel(){levels=[];for(let i=0;i<RINGS;i++){let safe=(i*5+level*2)%SEG;let danger=new Set();let count=Math.min(2+Math.floor(level/4),4);for(let j=0;j<count;j++)danger.add((safe+3+j*2)%SEG);levels.push({safe,danger});}}
function reset(){level=Math.max(1,level);angle=0;ballY=TOP;vy=0;scroll=0;won=false;running=true;fallTime=0;hideMsg();makeLevel();levelEl.textContent=level;last=performance.now();requestAnimationFrame(loop)}
function hideMsg(){document.getElementById('msg').style.display='none'}
function showMsg(title,text,button){running=false;document.getElementById('msgTitle').textContent=title;document.getElementById('msgText').textContent=text;document.getElementById('next').textContent=button;document.getElementById('msg').style.display='block'}
function norm(a){a%=Math.PI*2;return a<0?a+Math.PI*2:a}
function segmentAt(a){return Math.floor(norm(a)/(Math.PI*2/SEG))}
function tileColor(i,seg){let d=levels[i]?.danger.has(seg);if(d)return '#050505';let hue=(seg*30+i*23+level*11)%360;return `hsl(${hue} 100% 58%)`}
function draw(){ctx.fillStyle='#02030b';ctx.fillRect(0,0,W,H);let grad=ctx.createRadialGradient(CX,110,10,CX,300,330);grad.addColorStop(0,'#15205a');grad.addColorStop(1,'#02030b');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
for(let i=0;i<RINGS;i++){let y=TOP+i*RING_GAP-scroll; if(y<-70||y>H+70)continue;let r=65+i*1.5;for(let s=0;s<SEG;s++){let a0=angle+s*Math.PI*2/SEG+.055,a1=angle+(s+1)*Math.PI*2/SEG-.055;ctx.save();ctx.beginPath();ctx.arc(CX,y,r,a0,a1);ctx.lineWidth=20;ctx.strokeStyle=tileColor(i,s);ctx.shadowBlur=levels[i]?.danger.has(s)?0:18;ctx.shadowColor=ctx.strokeStyle;ctx.stroke();ctx.restore()}}
ctx.shadowBlur=25;ctx.shadowColor='#fff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CX,TOP-20,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
function collide(){let rel=ballY-(TOP-scroll);let i=Math.round(rel/RING_GAP);if(i<0||i>=RINGS)return false;let ringY=TOP+i*RING_GAP-scroll;if(Math.abs(ballY-ringY)>17)return false;let seg=segmentAt(angle+Math.PI/2);return !levels[i].danger.has(seg)}
function fail(){running=false;showMsg('💀 CRASH!','You hit a BLACK deadly tile.','RETRY')}
function clearLevel(){running=false;won=true;let b=Math.max(level,+(localStorage.getItem(bestKey)||1));localStorage.setItem(bestKey,b);bestEl.textContent=b;showMsg('✨ LEVEL CLEAR!','Great drop! The next level gets harder.','NEXT LEVEL')}
function loop(t){let dt=Math.min(32,t-last);last=t;if(running){vy+=.00115*dt;ballY+=vy*dt;fallTime+=dt;if(ballY>H-80){clearLevel()}else if(collide()){fail()}if(ballY>TOP+RING_GAP*4){scroll=Math.min(RING_GAP*4,scroll+vy*dt*.72)}}draw();if(running)requestAnimationFrame(loop)}
function change(v){if(!running)return;angle+=v}
let pointerX=0; c.addEventListener('pointerdown',e=>{drag=true;pointerX=e.clientX;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-pointerX)*.012;pointerX=e.clientX}});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')change(-.16);if(e.key==='ArrowRight')change(.16);if(e.key.toLowerCase()==='r'){level=1;reset()}});
left.addEventListener('click',()=>change(-.28));right.addEventListener('click',()=>change(.28));restart.onclick=()=>reset();next.onclick=()=>{if(won){level++;levelEl.textContent=level;reset()}else reset()};
reset();
</script></body></html>
